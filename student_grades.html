<!DOCTYPE html>
<!-- WD1-L4: Student Grades | HTML file with external CSS and JS -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grades</title>

  <!-- External CSS (css folder) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">

    <!-- Section 1: List of enrolled students (filled in by JS from the arrays) -->
    <h1>List of Enrolled Students</h1>
    <table>
      <thead>
        <tr>
          <th>Student Name</th>
          <th>Grade</th>
        </tr>
      </thead>
      <tbody id="studentList">
        <!-- Rows are generated by displayStudents() in js/script.js -->
      </tbody>
    </table>

    <!-- Button calls the function in the external JS file -->
    <button class="btn" onclick="showGradeEquivalent()">Show Grade Equivalent</button>

    <!-- Section 2: Grade equivalents (hidden until the button is clicked) -->
    <div id="resultSection" class="result hidden">
      <h2>Grade Equivalents</h2>
      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Grade</th>
            <th>Equivalent</th>
            <th>Remark</th>
            <th>Academic Leader</th>
          </tr>
        </thead>
        <tbody id="resultBody">
          <!-- Rows are generated by showGradeEquivalent() in js/script.js -->
        </tbody>
      </table>
    </div>

  </div>

  <!-- External JS (js folder), placed at the end of body so the elements already exist -->
  <script src="js/script.js"></script>
</body>
</html>
